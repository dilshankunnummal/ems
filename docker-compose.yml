# ==============================================================================
# Enterprise Employee Management System — Local / Production-like Stack
#   docker compose up -d --build
# ==============================================================================
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ems_network

  db:
    image: postgres:16-alpine
    container_name: ems_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ems_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ems_password}
      POSTGRES_DB: ${DB_NAME:-ems_db}
    ports:
      - "5432:5432"
    volumes:
      - ems_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ems_user} -d ${DB_NAME:-ems_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ems_network

  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ems_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ems_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ems_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ems.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - ems_network
    profiles:
      - tools

networks:
  ems_network:
    driver: bridge

volumes:
  ems_pg_data:
  ems_redis_data:
